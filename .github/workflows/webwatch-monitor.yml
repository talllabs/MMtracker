name: WebWatch RFP Monitor

on:
  schedule:
    - cron: '0 13 * * *'  # Runs once a day at 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run WebWatch monitor
        env:
          BASE44_WEBHOOK_URL: ${{ secrets.BASE44_WEBHOOK_URL }}
        run: python webwatch_monitor.py

      - name: Commit updated cache, log, and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webwatch_cache.json webwatch_log.txt webwatch_results.csv
          git diff --cached --quiet || git commit -m "Update WebWatch cache, log, and results [skip ci]"
          git push
